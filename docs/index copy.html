  <script id="10" type="application/sql" hidden="" database="duckdb" output="valoresDeciles">
    /* Calcular deciles del promedio PAES */
    WITH tabla as (SELECT
      paes.RBD,
      NOM_RBD,
      NOM_COM_RBD,
      GRUPO_DEPENDENCIA,
      CLEC_REG_ACTUAL,
      MATE1_REG_ACTUAL,
      (CLEC_REG_ACTUAL+MATE1_REG_ACTUAL) / 2 as PROMEDIO

      FROM "data/Rinden_Admisión2026/ArchivoC_Adm2026REG.csv" paes
      LEFT JOIN "data/Directorio-Oficial-EE-2025/20250926_Directorio_Oficial_EE_2025_20250430_WEB.csv" dir
        ON paes.RBD = dir.RBD
      WHERE SITUACION_EGRESO = 1 AND CLEC_REG_ACTUAL > 0 AND MATE1_REG_ACTUAL > 0
    )

    SELECT
      'Decil ' || (ROW_NUMBER() OVER (ORDER BY percentile)) as decil,
      ROUND(percentile, 1) as valor_minimo
    FROM (
      SELECT DISTINCT
        QUANTILE(PROMEDIO, 0.1) OVER () as p10,
        QUANTILE(PROMEDIO, 0.2) OVER () as p20,
        QUANTILE(PROMEDIO, 0.3) OVER () as p30,
        QUANTILE(PROMEDIO, 0.4) OVER () as p40,
        QUANTILE(PROMEDIO, 0.5) OVER () as p50,
        QUANTILE(PROMEDIO, 0.6) OVER () as p60,
        QUANTILE(PROMEDIO, 0.7) OVER () as p70,
        QUANTILE(PROMEDIO, 0.8) OVER () as p80,
        QUANTILE(PROMEDIO, 0.9) OVER () as p90,
        MAX(PROMEDIO) OVER () as p100
      FROM tabla
    )
    UNPIVOT (
      percentile FOR decil_name IN (p10, p20, p30, p40, p50, p60, p70, p80, p90, p100)
    )
    ORDER BY percentile
  </script>
  <script id="6" type="application/sql" hidden="" database="duckdb" output="datosEstudiantesPAES2026">
    WITH tabla as (SELECT
      paes.RBD,
      NOM_RBD,
      NOM_COM_RBD,
      GRUPO_DEPENDENCIA,
      CLEC_REG_ACTUAL,
      MATE1_REG_ACTUAL,
      (CLEC_REG_ACTUAL+MATE1_REG_ACTUAL) / 2 as PROMEDIO

      FROM "data/Rinden_Admisión2026/ArchivoC_Adm2026REG.csv" paes
      LEFT JOIN "data/Directorio-Oficial-EE-2025/20250926_Directorio_Oficial_EE_2025_20250430_WEB.csv" dir
        ON paes.RBD = dir.RBD
      WHERE SITUACION_EGRESO = 1 AND CLEC_REG_ACTUAL > 0 AND MATE1_REG_ACTUAL > 0
      ORDER BY PROMEDIO DESC
    ),

      top100 as (

        SELECT RBD,
          NOM_RBD,
          NOM_COM_RBD,
          GRUPO_DEPENDENCIA,
          AVG(PROMEDIO) as PROMEDIO,
          COUNT(*) as estudiantes
        FROM tabla
        GROUP BY RBD,
          NOM_RBD,
          NOM_COM_RBD,
          GRUPO_DEPENDENCIA,
          ORDER BY PROMEDIO DESC

        LIMIT 100)

    SELECT tabla.*,
      CASE WHEN top100.RBD IS NULL THEN 'NO TOP100' ELSE 'TOP100' END as top100
    FROM tabla
      LEFT JOIN top100
       ON tabla.RBD = top100.RBD
    ORDER BY (CLEC_REG_ACTUAL+MATE1_REG_ACTUAL) / 2 DESC


  </script>
  <script id="29" type="application/sql" hidden="" database="duckdb" output="resumenTop10GrupoDependencia">
    WITH tabla as (SELECT
      paes.RBD,
      NOM_RBD,
      NOM_COM_RBD,
      GRUPO_DEPENDENCIA,
      CLEC_REG_ACTUAL,
      MATE1_REG_ACTUAL,
      (CLEC_REG_ACTUAL+MATE1_REG_ACTUAL) / 2 as PROMEDIO

      FROM "data/Rinden_Admisión2026/ArchivoC_Adm2026REG.csv" paes
      LEFT JOIN "data/Directorio-Oficial-EE-2025/20250926_Directorio_Oficial_EE_2025_20250430_WEB.csv" dir
        ON paes.RBD = dir.RBD
      WHERE SITUACION_EGRESO = 1 AND CLEC_REG_ACTUAL > 0 AND MATE1_REG_ACTUAL > 0
      ORDER BY PROMEDIO DESC
    ),

    tabla2 as (SELECT RBD,
      GRUPO_DEPENDENCIA,
      count(*) as estudiantes
    FROM tabla
        WHERE PROMEDIO >= ${p90}

    FROM tabla2

  </script>

  <script id="33" type="application/sql" hidden="" database="duckdb" output="dataTop10PorEstablecimeinto">
    WITH tabla as (SELECT
      paes.RBD,
      NOM_RBD,
      NOM_COM_RBD,
      GRUPO_DEPENDENCIA,
      CASE WHEN GRUPO_DEPENDENCIA = 1 THEN 'Particular pagado' ELSE 'Financiamiento público' END as tipoFinanciamiento,
      CLEC_REG_ACTUAL,
      MATE1_REG_ACTUAL,
      (CLEC_REG_ACTUAL+MATE1_REG_ACTUAL) / 2 as PROMEDIO

      FROM "data/Rinden_Admisión2026/ArchivoC_Adm2026REG.csv" paes
      LEFT JOIN "data/Directorio-Oficial-EE-2025/20250926_Directorio_Oficial_EE_2025_20250430_WEB.csv" dir
        ON paes.RBD = dir.RBD
      WHERE SITUACION_EGRESO = 1 AND CLEC_REG_ACTUAL > 0 AND MATE1_REG_ACTUAL > 0
      ORDER BY PROMEDIO DESC
    ),

    tabla2 as (SELECT RBD,
      NOM_RBD,
      NOM_COM_RBD,
      tipoFinanciamiento,
      CASE
        WHEN GRUPO_DEPENDENCIA = 1 THEN 'Particular Pagado'
        WHEN GRUPO_DEPENDENCIA = 2 THEN 'Particular Subvencionado'
        WHEN GRUPO_DEPENDENCIA = 3 THEN 'Municipal'
        WHEN GRUPO_DEPENDENCIA = 4 THEN 'Servicio Local'
        ELSE 'Otro'
      END as dependencia,

      count(*) as estudiantes
    FROM tabla
      WHERE PROMEDIO >= ${p90}
    GROUP BY RBD,
      NOM_RBD,
      NOM_COM_RBD,
      GRUPO_DEPENDENCIA,
      tipoFinanciamiento,
      ORDER BY count(*) DESC

    )
